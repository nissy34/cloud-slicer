# The Device tab relay: one Durable Object per bridge, hibernating websockets
# so idle bridges cost nothing. Free plan: SQLite-backed Durable Objects.
name = "cloud-slicer-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# web-push (print alerts) uses Node's crypto and Buffer.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Where setup codes come from: a bridge spending one is checked there.
[vars]
SITE_ORIGIN = "https://slicer.awesomestuff.qzz.io"

[[durable_objects.bindings]]
name = "BRIDGE"
class_name = "Bridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Bridge"]

# Abuse limits, per client IP: websocket connects (browsers reconnect, the
# agent retries with backoff) and new bridge ids claimed.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CLAIM_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Bridges removed on their computer (/v1/bridges/<id>/release), apart from setup codes.
[[ratelimits]]
name = "RELEASE_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# The one-file bridge apps (CI uploads them on main). CI drops this
# block when the Cloudflare token can't reach R2, and the relay then offers
# no bridge downloads.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "cloud-slicer-bridge"

# The installers are served as text: /install.sh (macOS, Linux, printers),
# /install.ps1 (PowerShell) and /install.cmd (Command Prompt).
[[rules]]
type = "Text"
globs = ["**/install.sh", "**/install.ps1", "**/install.cmd"]
fallthrough = false
