# The Device tab relay: one Durable Object per bridge, hibernating websockets
# so idle bridges cost nothing. Free plan: SQLite-backed Durable Objects.
name = "cloud-slicer-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "BRIDGE"
class_name = "Bridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Bridge"]

# Abuse limits, per client IP: websocket connects (browsers reconnect, the
# agent retries with backoff) and new bridge ids claimed.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CLAIM_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# The one-file bridge apps (CI uploads them on main). CI drops this
# block when the Cloudflare token can't reach R2, and the relay then offers
# only the Node.js bridge.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "cloud-slicer-bridge"

# The bridge agent is served as text at /bridge.mjs, the Linux installer at /install.sh.
[[rules]]
type = "Text"
globs = ["**/bridge.mjs", "**/install.sh"]
fallthrough = false
