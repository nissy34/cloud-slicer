# Two heads that swap (T0 / T1), a heated bed and two cameras.
[include common.cfg]

[extruder]
step_pin: PC7
dir_pin: !PD4
enable_pin: virtual_pin:e0_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e0_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_0]
pin: virtual_pin:e0_fan
heater: extruder

[extruder1]
step_pin: PD5
dir_pin: !PD6
enable_pin: virtual_pin:e1_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e1_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_1]
pin: virtual_pin:e1_fan
heater: extruder1

[heater_bed]
heater_pin: virtual_pin:bed_heater
sensor_type: sim
sim_heat_rate: 3
sim_loss: 0.012
control: watermark
min_temp: 0
max_temp: 130

[gcode_macro T0]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
