# A small one-head printer with no heated bed and one camera.
[include common.cfg]

[stepper_x]
position_max: 180

[stepper_y]
position_max: 180

[stepper_z]
position_max: 180

[extruder]
step_pin: PC7
dir_pin: !PD4
enable_pin: virtual_pin:e0_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e0_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 280
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan]
pin: virtual_pin:e0_fan
heater: extruder
