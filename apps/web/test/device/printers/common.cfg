# Shared by every pretend printer here: the simulated board (an ATmega644p
# run by simulavr inside the container), cartesian motion, and the macros a
# slicer's G-code and the Device tab expect. Heaters warm up through
# sim_temperature.py; fans and heater outputs are virtual pins.
#
# Free board pins for steppers (step, dir): X PB0 PB1, Y PB3 PC2, Z PC4 PC5,
# extruder PC7 PD4, extruder1 PD5 PD6, extruder2 PB4 PB5, extruder3 PB6 PB7.
# Endstops: X PB2, Y PC3, Z PC6.
# Steppers use no microsteps: the simulated board is slow, and fewer steps
# keep it from falling behind ("Timer too close").

[sim_temperature]

[mcu]
serial: /tmp/pseudoserial
restart_method: arduino

[virtual_pins]

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 6000
max_z_velocity: 15
max_z_accel: 200

[stepper_x]
step_pin: PB0
dir_pin: !PB1
enable_pin: virtual_pin:x_enable
microsteps: 1
rotation_distance: 40
endstop_pin: ^PB2
position_endstop: 0
position_max: 235
homing_speed: 100
homing_retract_dist: 0

[stepper_y]
step_pin: PB3
dir_pin: !PC2
enable_pin: virtual_pin:y_enable
microsteps: 1
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 235
homing_speed: 100
homing_retract_dist: 0

[stepper_z]
step_pin: PC4
dir_pin: PC5
enable_pin: virtual_pin:z_enable
microsteps: 1
rotation_distance: 40
endstop_pin: ^PC6
position_endstop: 0
position_max: 250
homing_retract_dist: 0

[fan]
pin: virtual_pin:part_fan

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[display_status]
[respond]
[exclude_object]
[gcode_arcs]

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  G91
  G1 Z5 F600
  G90

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M107
  CANCEL_PRINT_BASE

[gcode_macro PRINT_START]
gcode:
  G28

[gcode_macro PRINT_END]
gcode:
  TURN_OFF_HEATERS
  M107
