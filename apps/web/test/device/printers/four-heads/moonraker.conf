[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: {data_path}/comms/klippy.sock

[file_manager]
enable_object_processing: true

[machine]
provider: systemd_cli
validate_service: false

[data_store]
temperature_store_size: 600
gcode_store_size: 1000

[authorization]
force_logins: false
trusted_clients:
  0.0.0.0/0
cors_domains:
  *

[history]
