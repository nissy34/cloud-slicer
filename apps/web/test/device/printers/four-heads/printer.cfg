# Four heads like the U1 but plain Klipper: a 270 mm bed, a heated bed,
# a chamber thermometer and no camera.
[include common.cfg]

[stepper_x]
position_max: 270

[stepper_y]
position_max: 270

[stepper_z]
position_max: 270

[extruder]
step_pin: PC7
dir_pin: !PD4
enable_pin: virtual_pin:e0_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e0_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_0]
pin: virtual_pin:e0_fan
heater: extruder

[extruder1]
step_pin: PD5
dir_pin: !PD6
enable_pin: virtual_pin:e1_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e1_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_1]
pin: virtual_pin:e1_fan
heater: extruder1

[extruder2]
step_pin: PB4
dir_pin: !PB5
enable_pin: virtual_pin:e2_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e2_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_2]
pin: virtual_pin:e2_fan
heater: extruder2

[extruder3]
step_pin: PB6
dir_pin: !PB7
enable_pin: virtual_pin:e3_enable
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: virtual_pin:e3_heater
sensor_type: sim
sim_heat_rate: 20
sim_loss: 0.01
control: watermark
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 100

[heater_fan hotend_fan_3]
pin: virtual_pin:e3_fan
heater: extruder3

[heater_bed]
heater_pin: virtual_pin:bed_heater
sensor_type: sim
sim_heat_rate: 3
sim_loss: 0.012
control: watermark
min_temp: 0
max_temp: 130

[temperature_sensor chamber]
sensor_type: sim

[gcode_macro T0]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder1

[gcode_macro T2]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder2

[gcode_macro T3]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder3
