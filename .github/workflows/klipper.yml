name: Real Klipper printers

# The Device tab against real Klipper and Moonraker on simulated boards in Docker
# (apps/web/test/device/printers, apps/web/test/device-klipper.mjs). About 12
# minutes, so not on every pull request: every night on main, on any pull request
# labelled "real klipper", on pull requests that change these pretend printers or
# this test, and by hand (Actions, Run workflow). Never talks to a real printer.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: klipper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  # On a pull request: only with the label, or when it changes the printers or the test.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LABELLED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'real klipper') }}
        run: |
          if [ "$LABELLED" = true ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -qE '^(apps/web/test/device/printers/|apps/web/test/device-klipper\.mjs$|\.github/workflows/klipper\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  klipper:
    name: Real Klipper printers
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Start the pretend printers (one, two and four heads)
        working-directory: apps/web/test/device/printers
        run: |
          # The Klipper printers only; OctoPrint has its own test in device.yml.
          KLIPPERS='one-head two-heads four-heads'
          for i in 1 2 3; do docker compose pull -q $KLIPPERS && break; sleep 10; done
          # On some CI machines no simulated board answers Klipper on the first start; a
          # restart is the same as switching a printer off and on. Logged so it shows.
          lscpu | grep -E 'Model name|^CPU\(s\)|Hypervisor'
          if ! docker compose up -d --wait $KLIPPERS; then
            echo "::warning::The pretend printers didn't start; restarting them once"
            docker stats --no-stream
            for s in one-head two-heads four-heads; do
              docker compose exec -T $s sh -c 'tail -n 15 /printer/printer_data/logs/simulavr-stdout*; grep -m3 -E "Unable|Timeout|MHz|Mhz" /printer/printer_data/logs/klippy.log'
            done
            docker compose restart $KLIPPERS
            docker compose up -d --wait $KLIPPERS
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/device-relay/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum

      - name: Build the web app and the relay
        run: |
          (cd apps/device-relay && npm ci --no-audit --no-fund)
          cd apps/web
          npm ci --no-audit --no-fund
          npm run build

      - uses: ./.github/actions/playwright

      - name: Device tab on real Klipper (heat, home, console, print, skip, pause, cancel, four heads, phone, bridge)
        working-directory: apps/web
        timeout-minutes: 30
        run: node test/device-klipper.mjs klipper-shots

      - name: Printer logs
        if: failure()
        working-directory: apps/web/test/device/printers
        run: |
          docker compose ps
          for s in one-head two-heads four-heads; do
            echo "::group::$s klippy.log"; docker compose exec -T $s sh -c "grep -vE '^(Stats|Resetting prediction)' /printer/printer_data/logs/klippy.log | tail -n 80"; echo "::endgroup::"
            echo "::group::$s moonraker.log"; docker compose exec -T $s tail -n 80 /printer/printer_data/logs/moonraker.log; echo "::endgroup::"
            echo "::group::$s board and services"; docker compose exec -T $s sh -c 'tail -n 40 /printer/printer_data/logs/simulavr-stdout*; tail -n 40 /printer/printer_data/logs/supervisord.log; ls -l /tmp/pseudoserial'; echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: klipper-screenshots
          path: apps/web/klipper-shots

  # The Windows app is checked on Windows (starts with sign-in, no window,
  # removes itself) and the Mac apps are built on macOS, the only place they
  # can be signed (ad hoc, free). Free runners for a public repo.
