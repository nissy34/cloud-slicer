name: Device

# The Device tab: the bridge agent, the relay Worker and the web screen, tested
# end to end against pretend printers (apps/web/test/device/mock-printer.mjs).
# Never talks to a real printer.
#
# Two relays (when the Cloudflare secrets are set; the token needs Workers
# Scripts: Edit):
#  - live (cloud-slicer-relay, bridge downloads in R2 cloud-slicer-bridge), the
#    one everyone uses: deploys from main only.
#  - test (cloud-slicer-relay-test, downloads in cloud-slicer-bridge-test): where
#    a pull request's relay and bridge are tried on a real printer before they
#    merge. Add the label "use test relay" to the PR (or run this workflow on its
#    branch); every push to that PR then deploys there. One PR at a time: the
#    newest one sent wins. Its bridges are test builds ("Cloud Slicer Bridge
#    (test)") that install next to the real bridge and update only from the test
#    relay. Branch previews of the site set up new bridges on it (ci.yml). It
#    keeps what was sent last until something else is sent.

on:
  push:
    branches: [main]
    paths: ['apps/device-*/**', 'apps/web/src/device/**', 'apps/web/src/state/device.ts', 'apps/web/src/state/alerts.ts', 'apps/web/public/sw.js', 'apps/web/src/styles.css', 'apps/web/src/components/TopBar.tsx', 'apps/web/src/components/ThemeMenu.tsx', 'apps/web/src/account/AccountMenu.tsx', 'apps/web/test/device*', 'apps/web/test/device/**', '.github/workflows/device.yml', '.github/actions/playwright/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['apps/device-*/**', 'apps/web/src/device/**', 'apps/web/src/state/device.ts', 'apps/web/src/state/alerts.ts', 'apps/web/public/sw.js', 'apps/web/src/styles.css', 'apps/web/src/components/TopBar.tsx', 'apps/web/src/components/ThemeMenu.tsx', 'apps/web/src/account/AccountMenu.tsx', 'apps/web/test/device*', 'apps/web/test/device/**', '.github/workflows/device.yml', '.github/actions/playwright/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Which relay to deploy (on main; any other branch always goes to the test relay)'
        type: choice
        options: [live, test]
        default: live

permissions:
  contents: read

env:
  # npm gives up after 2 tries by default; registry downloads now and then drop
  # mid-way (ECONNRESET), so try harder before failing the job.
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  # Which relays this run deploys, and what the test relay will say it runs.
  where:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.w.outputs.targets }}
      test: ${{ steps.w.outputs.test }}
      what: ${{ steps.w.outputs.what }}
      build: ${{ steps.w.outputs.build }}
      site: ${{ steps.w.outputs.site }}
    steps:
      - id: w
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TARGET: ${{ inputs.target }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'use test relay') }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          live=false test=false what=main
          case "$EVENT" in
            push)
              [ "$REF" = refs/heads/main ] && live=true ;;
            pull_request)
              # Never the live relay. A PR from a fork has no secrets, so it can't deploy anyway.
              if [ "$LABELLED" = true ] && [ "$SAME_REPO" = true ]; then test=true what="PR #$PR"; fi ;;
            workflow_dispatch)
              if [ "$REF" != refs/heads/main ]; then test=true what="branch $BRANCH"
              elif [ "$INPUT_TARGET" = test ]; then test=true
              else live=true; fi ;;
          esac
          targets=$(jq -cn --argjson l "$live" --argjson t "$test" '[if $l then "live" else empty end, if $t then "test" else empty end]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "what=$what" >> "$GITHUB_OUTPUT"
          # One build number for every test app, newer than anything sent before, so
          # test bridges always take the newest one sent (even an older branch).
          echo "build=$(date +%s)" >> "$GITHUB_OUTPUT"
          # The site the test relay checks setup codes with: the branch's own Pages
          # preview (it makes the codes for the test relay), or the real site for main.
          site=https://slicer.awesomestuff.qzz.io
          if [ "$what" != main ]; then
            alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed -e 's/[^a-z0-9]/-/g' | cut -c1-28 | sed -e 's/-*$//')
            site="https://$alias.${{ vars.CF_PAGES_PROJECT || 'cloud-slicer' }}.pages.dev"
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "### Relays: $targets (test relay: $what)" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/device-relay/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum

      - name: Bridge tests, and builds for every Linux chip (x64, arm64, armv7, MIPS) and Windows
        working-directory: apps/device-bridge
        run: |
          for os in linux windows darwin; do GOOS=$os go vet ./...; done
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w on these files"; exit 1; }
          go test -race -count=1 ./...
          ./build.sh
          ./dist/linux-x64 version

      - name: Relay typecheck
        working-directory: apps/device-relay
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Web unit tests and build (no engine needed for the Device tab)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - uses: ./.github/actions/playwright

      - name: Device end to end (browser -> relay -> bridge -> mock U1, and direct)
        working-directory: apps/web
        timeout-minutes: 15
        env:
          CLOUD_SLICER_BRIDGE_BIN: ${{ github.workspace }}/apps/device-bridge/dist/linux-x64
        run: node test/device-smoke.mjs device-shots

      - name: Print alerts in the Device tab (Alerts card, bridge and direct printers, pretend push service)
        working-directory: apps/web
        timeout-minutes: 10
        env:
          CLOUD_SLICER_BRIDGE_BIN: ${{ github.workspace }}/apps/device-bridge/dist/linux-x64
        run: node test/device-alerts.mjs device-shots

      - name: Arrange the Device tab cards (move, hide, half width, columns, fold; kept after a reload; phone)
        working-directory: apps/web
        timeout-minutes: 5
        run: node test/device-arrange.mjs device-shots

      - name: The Linux bridge serves the mock U1 through a local relay (uploads, refusals, wrong keys)
        working-directory: apps/device-relay
        run: |
          npx wrangler dev --port 8797 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8797/ && break; sleep 1; done
          cd ../web
          node test/device/relay-live.mjs http://127.0.0.1:8797 --app ../device-bridge/dist/linux-x64
      - name: Print alerts on a local relay (mock printer -> bridge -> relay -> pretend push service)
        working-directory: apps/device-relay
        run: |
          node -e "const k=require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'});process.stdout.write(JSON.stringify(k.privateKey.export({format:'jwk'})))" > "$RUNNER_TEMP/vapid.json"
          npx wrangler dev --port 8796 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/relay-alerts" --var "VAPID_KEY:$(cat "$RUNNER_TEMP/vapid.json")" --var PUSH_TEST_ENDPOINTS:1 > wrangler-alerts.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8796/ && break; sleep 1; done
          cd ../web
          node test/device/alerts-live.mjs http://127.0.0.1:8796 --app ../device-bridge/dist/linux-x64

      - name: Relay with accounts (setup codes, tickets, camera cap, blocking) on a local relay
        working-directory: apps/device-relay
        run: |
          node -e "const k=require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'});const f=require('fs');f.writeFileSync('$RUNNER_TEMP/pub.json',JSON.stringify(k.publicKey.export({format:'jwk'})));f.writeFileSync('$RUNNER_TEMP/priv.json',JSON.stringify(k.privateKey.export({format:'jwk'})))"
          # The test plays the site on port 8799, to hand out a setup code for its bridge.
          npx wrangler dev --port 8798 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/relay-accounts" --var "RELAY_TICKET_PUBLIC_KEY:$(cat "$RUNNER_TEMP/pub.json")" --var "SITE_ORIGIN:http://127.0.0.1:8799" > wrangler-accounts.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8798/ && break; sleep 1; done
          cd ../web
          FAKE_SITE_PORT=8799 RELAY_TICKET_PRIVATE_KEY="$(cat "$RUNNER_TEMP/priv.json")" node test/device/relay-live.mjs http://127.0.0.1:8798 --app ../device-bridge/dist/linux-x64

      - name: The Linux bridge on a printer joins an account with a setup code, and Remove bridge removes it
        working-directory: apps/device-relay
        run: |
          # A relay with accounts (keys from the step above) and a stand-in site that takes the setup code CK23-4567.
          npx wrangler dev --port 8795 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/relay-printer" --var "RELAY_TICKET_PUBLIC_KEY:$(cat "$RUNNER_TEMP/pub.json")" --var "SITE_ORIGIN:http://127.0.0.1:8794" > wrangler-printer.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8795/ && break; sleep 1; done
          cd ../web
          export RELAY_TICKET_PRIVATE_KEY="$(cat "$RUNNER_TEMP/priv.json")"
          node test/device/fake-site.mjs 8794 > "$RUNNER_TEMP/fake-site.log" 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8794/ && break; sleep 1; done
          relay=http://127.0.0.1:8795
          bridge=../device-bridge/dist/linux-x64
          # On a printer (this runner stands in for a Pi: systemd, a printer_data folder):
          # a root service, in the account, and Remove bridge removing it all.
          data="$RUNNER_TEMP/printer_data"
          mkdir -p "$data/config"
          # Without a setup code nothing is installed.
          rc=0; sudo $bridge install-printer --printer-data "$data" --relay $relay > "$RUNNER_TEMP/no-code.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/no-code.log"
          if [ "$rc" != 3 ]; then echo "Without a setup code the printer install didn't ask for one ($rc)"; exit 1; fi
          if [ -e "$data/cloud-slicer-bridge" ]; then echo "Installed without a setup code"; exit 1; fi
          sudo $bridge install-printer --printer-data "$data" --relay $relay --code CK23-4567 | tee "$RUNNER_TEMP/install.log"
          grep -q 'Connected to your Cloud Slicer account as Printer bridge on CI' "$RUNNER_TEMP/install.log" || { echo "The printer bridge didn't join the account"; exit 1; }
          if grep -qi 'pair' "$RUNNER_TEMP/no-code.log" "$RUNNER_TEMP/install.log"; then echo "The bridge still talks about pairing"; exit 1; fi
          if ls "$data/config" | grep -qi pair; then echo "The bridge left a pairing file in the config folder"; exit 1; fi
          systemctl is-active cloud-slicer-bridge
          sudo cat "$data/cloud-slicer-bridge/bridge.json" > "$RUNNER_TEMP/printer-bridge.json"
          node test/device/printer-bridge.mjs $relay "$data" "$RUNNER_TEMP/printer-bridge.json"
          sleep 2
          if systemctl is-active cloud-slicer-bridge; then echo "The service still runs"; exit 1; fi
          if [ -e /etc/systemd/system/cloud-slicer-bridge.service ]; then echo "The service file is still there"; exit 1; fi
          # The printer uninstall line (install.sh --printer --uninstall), as a normal user: it downloads
          # nothing, finds the bridge in printer_data (here $HOME/printer_data) and removes it with sudo.
          sudo $bridge install-printer --printer-data "$data" --relay $relay --code CK23-4567
          systemctl is-active cloud-slicer-bridge
          curl -fsS $relay/install.sh > "$RUNNER_TEMP/install.sh"
          HOME="$RUNNER_TEMP" sh "$RUNNER_TEMP/install.sh" --printer --uninstall | tee "$RUNNER_TEMP/uninstall.log"
          grep -q 'Removed the bridge from this printer' "$RUNNER_TEMP/uninstall.log"
          if grep -q 'Downloading' "$RUNNER_TEMP/uninstall.log"; then echo "Uninstall downloaded the bridge"; exit 1; fi
          sleep 2
          if systemctl is-active cloud-slicer-bridge; then echo "The service still runs after uninstall"; exit 1; fi
          # Typed by hand as a normal user, the bridge asks sudo for root by itself.
          sudo $bridge install-printer --printer-data "$data" --relay $relay --code CK23-4567
          $bridge uninstall --printer-data "$data" | grep -q 'Removed the bridge from this printer'
          sleep 2
          if systemctl is-active cloud-slicer-bridge; then echo "The service still runs after uninstall"; exit 1; fi
          grep -c '^claim ' "$RUNNER_TEMP/fake-site.log"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: device-screenshots
          path: apps/web/device-shots

  # The Windows app is checked on Windows (starts with sign-in, no window,
  # removes itself) and the Mac apps are built on macOS, the only place they
  # can be signed (ad hoc, free). Free runners for a public repo.
  apps-windows:
    needs: where
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum
      - name: Build the Windows app with its icon
        working-directory: apps/device-bridge
        env:
          # Builds the update key's public half into the app (tools/release); without it the app never updates itself.
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
        run: |
          ./build.sh windows-x64
          cp dist/windows-x64 "$RUNNER_TEMP/bridge.exe"
          "$RUNNER_TEMP/bridge.exe" version
      - name: The app carries its name (so its icon and version resources went in)
        shell: pwsh
        run: |
          $info = (Get-Item "$env:RUNNER_TEMP/bridge.exe").VersionInfo
          $info | Format-List ProductName, FileDescription, FileVersion
          if ($info.ProductName -ne 'Cloud Slicer Bridge') { throw "No version resources in the app" }
      - name: Install joins the account with a setup code, starts it in the background and at sign-in; uninstall removes all of it
        run: |
          # A local stand-in for the relay that takes the setup code CK23-4567, as the real one does.
          node apps/web/test/device/setup-relay.mjs 8791 > "$RUNNER_TEMP/relay-install.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8791/v1/info && break; sleep 1; done
          # Without a setup code it installs nothing and asks for one (exit status 3).
          rc=0; "$RUNNER_TEMP/bridge.exe" install --no-browser --relay http://127.0.0.1:8791 > "$RUNNER_TEMP/no-code.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/no-code.log"
          if [ "$rc" != 3 ]; then echo "Without a setup code the install didn't ask for one ($rc)"; exit 1; fi
          if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' //v CloudSlicerBridge 2>/dev/null; then echo "Installed without a setup code"; exit 1; fi
          "$RUNNER_TEMP/bridge.exe" install --no-browser --relay http://127.0.0.1:8791 --code ck23-4567 > "$RUNNER_TEMP/install.log" 2>&1
          cat "$RUNNER_TEMP/install.log"
          grep -q 'Connected to your Cloud Slicer account as Bridge on CI' "$RUNNER_TEMP/install.log" || { echo "The bridge didn't join the account"; exit 1; }
          grep -q '^claim ok .*(win32' "$RUNNER_TEMP/relay-install.log" || { cat "$RUNNER_TEMP/relay-install.log"; echo "The relay never got the setup code"; exit 1; }
          # Pairing links are gone: a bridge only ever joins with a setup code.
          if grep -qi 'pair' "$RUNNER_TEMP/no-code.log" "$RUNNER_TEMP/install.log"; then echo "The bridge still talks about pairing"; exit 1; fi
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' //v CloudSlicerBridge
          dir="$LOCALAPPDATA/Cloud Slicer Bridge"
          test -x "$dir/cloud-slicer-bridge.exe"
          for i in $(seq 1 20); do tasklist //FI 'IMAGENAME eq cloud-slicer-bridge.exe' | grep -q cloud-slicer-bridge && break; sleep 1; done
          tasklist //FI 'IMAGENAME eq cloud-slicer-bridge.exe' | grep cloud-slicer-bridge
          # Deleting the folder afterwards shows no window (it once opened a console with ping
          # in it). A program that opens its own console gets a console host (conhost) of its
          # own: none may belong to the ping the cleanup runs. Watched from before the uninstall.
          powershell -NoProfile -Command '$end = (Get-Date).AddSeconds(20); $seen = $false; while ((Get-Date) -lt $end) { $p = Get-CimInstance Win32_Process; $ping = @($p | Where-Object Name -eq "ping.exe" | ForEach-Object ProcessId); if ($ping.Count) { $seen = $true } elseif ($seen) { exit 0 }; if ($p | Where-Object { $_.Name -eq "conhost.exe" -and $ping -contains $_.ParentProcessId }) { "ping opened its own console"; exit 1 } }; "The cleanup never ran"; exit 1' &
          watcher=$!
          sleep 3
          "$dir/cloud-slicer-bridge.exe" uninstall > "$RUNNER_TEMP/uninstall.log" 2>&1
          cat "$RUNNER_TEMP/uninstall.log"
          grep -q 'and from your Cloud Slicer account' "$RUNNER_TEMP/uninstall.log" || { echo "Uninstall didn't leave the account"; exit 1; }
          grep -q '^release ' "$RUNNER_TEMP/relay-install.log" || { echo "The relay never heard the bridge leave"; exit 1; }
          wait $watcher || { echo "Uninstall opened a window"; exit 1; }
          # The folder goes just after the program exits (Windows can't delete a running program).
          for i in $(seq 1 15); do [ -e "$dir" ] || break; sleep 1; done
          if tasklist //FI 'IMAGENAME eq cloud-slicer-bridge.exe' | grep -q cloud-slicer-bridge; then echo "The bridge still runs"; exit 1; fi
          if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' //v CloudSlicerBridge 2>/dev/null; then echo "Still starts at sign-in"; exit 1; fi
          if [ -e "$dir" ]; then ls -la "$dir"; echo "Files left behind"; exit 1; fi
          if [ -e "$USERPROFILE/.cloud-slicer-bridge.json" ]; then echo "Settings left behind"; exit 1; fi
      - name: The PowerShell install line finishes (it doesn't wait for the bridge it leaves running)
        timeout-minutes: 3
        run: |
          # The line as Add a bridge gives it, with its setup code, against the local stand-in
          # relay, which also serves the app download. (The app built here is set to the real
          # relay, so the line passes --relay too.)
          mkdir -p "$RUNNER_TEMP/site" && cp "$RUNNER_TEMP/bridge.exe" "$RUNNER_TEMP/site/windows-x64"
          node apps/web/test/device/setup-relay.mjs 8790 "$RUNNER_TEMP/site" > "$RUNNER_TEMP/relay-line.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8790/download/windows-x64 && break; sleep 1; done
          sed -e 's#__RELAY_URL__#http://127.0.0.1:8790#' -e 's#__SETUP_CODE__#CK23-4567#' \
            -e "s#@('install', '--no-browser')#@('install', '--no-browser', '--relay', \$relay)#" \
            apps/device-bridge/install.ps1 > "$RUNNER_TEMP/install.ps1"
          grep -qF "'--relay', \$relay" "$RUNNER_TEMP/install.ps1"
          # Windows PowerShell, as people have it; it must come back on its own.
          # (It ends with the bridge's own exit status: 0 when it's set up.)
          rc=0; timeout 90 powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw '$RUNNER_TEMP/install.ps1' | Invoke-Expression; exit "'$LASTEXITCODE' || rc=$?
          if [ "$rc" = 124 ]; then echo "The PowerShell line never finished"; exit 1; fi
          if [ "$rc" != 0 ]; then echo "The PowerShell line failed ($rc)"; exit 1; fi
          grep -q '^claim ok ' "$RUNNER_TEMP/relay-line.log" || { cat "$RUNNER_TEMP/relay-line.log"; echo "The PowerShell line didn't spend its setup code"; exit 1; }
          # It waited for the setup program to finish (PowerShell doesn't wait for a program
          # with no window unless told to): the program it downloaded is gone, not still running.
          powershell -NoProfile -Command "if (Test-Path (Join-Path \$env:TEMP 'cloud-slicer-bridge-setup.exe')) { exit 1 }" ||
            { echo "The PowerShell line came back before the setup finished"; exit 1; }
          for i in $(seq 1 20); do tasklist //FI 'IMAGENAME eq cloud-slicer-bridge.exe' | grep -q cloud-slicer-bridge && break; sleep 1; done
          tasklist //FI 'IMAGENAME eq cloud-slicer-bridge.exe' | grep cloud-slicer-bridge || { echo "The bridge isn't running after the PowerShell line"; exit 1; }
          # Installed apps (Settings, Apps) lists it, with an Uninstall that runs the bridge's own; the Start menu has it.
          entry='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\CloudSlicerBridge'
          reg query "$entry" //v UninstallString | grep -F 'cloud-slicer-bridge.exe" uninstall' || { echo "No Installed apps entry"; exit 1; }
          reg query "$entry" //v DisplayName | grep -F 'Cloud Slicer Bridge' || { echo "The Installed apps entry has no name"; exit 1; }
          shortcut="$APPDATA/Microsoft/Windows/Start Menu/Programs/Cloud Slicer Bridge.lnk"
          [ -f "$shortcut" ] || { echo "No Start menu entry"; exit 1; }
          timeout 60 "$LOCALAPPDATA/Cloud Slicer Bridge/cloud-slicer-bridge.exe" uninstall
          # A setup code that isn't right: the line passes on the setup's own failure (it
          # only can when it waits for the setup), and asks for a new code on exit status 3
          # (none here: it says nothing was installed).
          sed -e 's#__RELAY_URL__#http://127.0.0.1:8790#' -e 's#__SETUP_CODE__#ABCD-EFGH#' \
            -e "s#@('install', '--no-browser')#@('install', '--no-browser', '--relay', \$relay)#" \
            apps/device-bridge/install.ps1 > "$RUNNER_TEMP/install-code.ps1"
          rc=0; echo | timeout 90 powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw '$RUNNER_TEMP/install-code.ps1' | Invoke-Expression; exit "'$LASTEXITCODE' || rc=$?
          if [ "$rc" = 124 ]; then echo "The PowerShell line with a setup code never finished"; exit 1; fi
          if [ "$rc" = 0 ]; then echo "The PowerShell line didn't see that the setup failed"; exit 1; fi
          grep -q '^claim wrong ' "$RUNNER_TEMP/relay-line.log" || { echo "The wrong setup code never reached the relay"; exit 1; }
          if reg query "$entry" >/dev/null 2>&1; then echo "Uninstall left the Installed apps entry (or a wrong code installed it)"; exit 1; fi
          if [ -e "$shortcut" ]; then echo "Uninstall left the Start menu entry (or a wrong code installed it)"; exit 1; fi
      - uses: actions/upload-artifact@v6
        with:
          name: bridge-app-windows
          path: apps/device-bridge/dist/windows-x64
          if-no-files-found: error
      - name: The test relay's Windows app
        if: needs.where.outputs.test == 'true'
        working-directory: apps/device-bridge
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
          FLAVOR: test
          RELAY_URL: https://cloud-slicer-relay-test.awesomestuff.qzz.io
          BUILD: ${{ needs.where.outputs.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/test" && ./build.sh windows-x64 && cp dist/windows-x64 "$RUNNER_TEMP/test/windows-x64"
          "$RUNNER_TEMP/test/windows-x64" version | grep -q ' test)'
      - uses: actions/upload-artifact@v6
        if: needs.where.outputs.test == 'true'
        with:
          name: bridge-test-app-windows
          path: ${{ runner.temp }}/test/windows-x64
          if-no-files-found: error

  apps-mac:
    needs: where
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum
      - name: Build the Mac apps (Cloud Slicer Bridge.app, with its icon, signed ad hoc)
        working-directory: apps/device-bridge
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
        run: |
          ./build.sh mac
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app" && unzip -q "$GITHUB_WORKSPACE/apps/device-bridge/dist/mac-arm64"
          app="$RUNNER_TEMP/app/Cloud Slicer Bridge.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/icon.icns"
          "$app/Contents/MacOS/cloud-slicer-bridge" version
          # install copies the program out of the .app; that copy has to run too.
          cp "$app/Contents/MacOS/cloud-slicer-bridge" "$RUNNER_TEMP/copied" && "$RUNNER_TEMP/copied" version
      - name: Installing puts the app in Applications (it opens the status window), and uninstall takes it away
        timeout-minutes: 3
        run: |
          app="$RUNNER_TEMP/app/Cloud Slicer Bridge.app"
          # A local stand-in for the relay that takes the setup code CK23-4567, as the real one does.
          node apps/web/test/device/setup-relay.mjs 8791 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8791/v1/info && break; sleep 1; done
          "$app/Contents/MacOS/cloud-slicer-bridge" install --no-browser --relay http://127.0.0.1:8791 --code CK23-4567 | tee "$RUNNER_TEMP/install.log"
          grep -q 'Connected to your Cloud Slicer account as Bridge on CI' "$RUNNER_TEMP/install.log" || { echo "The bridge didn't join the account"; exit 1; }
          if grep -qi 'pair' "$RUNNER_TEMP/install.log"; then echo "The bridge still talks about pairing"; exit 1; fi
          opener="$HOME/Applications/Cloud Slicer Bridge.app"
          test -x "$opener/Contents/MacOS/cloud-slicer-bridge" || { echo "No app in Applications"; exit 1; }
          codesign --verify --deep --strict "$opener"
          "$HOME/Library/Application Support/Cloud Slicer Bridge/cloud-slicer-bridge" uninstall
          if [ -e "$opener" ]; then echo "Uninstall left the app in Applications"; exit 1; fi
      - uses: actions/upload-artifact@v6
        with:
          name: bridge-app-mac
          path: |
            apps/device-bridge/dist/mac-arm64
            apps/device-bridge/dist/mac-x64
          if-no-files-found: error
      - name: The test relay's Mac apps
        if: needs.where.outputs.test == 'true'
        working-directory: apps/device-bridge
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
          FLAVOR: test
          RELAY_URL: https://cloud-slicer-relay-test.awesomestuff.qzz.io
          BUILD: ${{ needs.where.outputs.build }}
        run: |
          ./build.sh mac
          mkdir -p "$RUNNER_TEMP/test" && cp dist/mac-arm64 dist/mac-x64 "$RUNNER_TEMP/test/"
      - uses: actions/upload-artifact@v6
        if: needs.where.outputs.test == 'true'
        with:
          name: bridge-test-app-mac
          path: |
            ${{ runner.temp }}/test/mac-arm64
            ${{ runner.temp }}/test/mac-x64
          if-no-files-found: error

  deploy-relay:
    needs: [where, test, apps-windows, apps-mac]
    if: needs.where.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.where.outputs.targets) }}
    # One deploy per relay at a time, in order.
    concurrency:
      group: relay-${{ matrix.target }}
      cancel-in-progress: false
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ matrix.target == 'test' && 'cloud-slicer-relay-test' || 'cloud-slicer-relay' }}
      BUCKET: ${{ matrix.target == 'test' && 'cloud-slicer-bridge-test' || 'cloud-slicer-bridge' }}
      # The relay's own address: a Workers custom domain, added once in the Cloudflare
      # dashboard. Its workers.dev address keeps answering too.
      RELAY_ORIGIN: ${{ matrix.target == 'test' && 'https://cloud-slicer-relay-test.awesomestuff.qzz.io' || 'https://cloud-slicer-relay.awesomestuff.qzz.io' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/device-relay/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/device-bridge/go.mod
          cache-dependency-path: apps/device-bridge/go.sum
      - name: The test relay is its own Worker, with its own downloads and limits
        if: matrix.target == 'test'
        working-directory: apps/device-relay
        run: |
          sed -i -e 's/^name = "cloud-slicer-relay"$/name = "cloud-slicer-relay-test"/' \
            -e 's/^bucket_name = "cloud-slicer-bridge"$/bucket_name = "cloud-slicer-bridge-test"/' \
            -e 's/^namespace_id = "1001"$/namespace_id = "2001"/' -e 's/^namespace_id = "1002"$/namespace_id = "2002"/' -e 's/^namespace_id = "1003"$/namespace_id = "2003"/' wrangler.toml
          # Never the live relay from here.
          grep -qx 'name = "cloud-slicer-relay-test"' wrangler.toml
          grep -qx 'bucket_name = "cloud-slicer-bridge-test"' wrangler.toml
          if grep -q '"cloud-slicer-relay"\|"cloud-slicer-bridge"' wrangler.toml; then echo "Still names the live relay"; exit 1; fi
      - name: Deploy the ${{ matrix.target }} relay Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: apps/device-relay
        env:
          WHAT: ${{ needs.where.outputs.what }}
          SITE: ${{ needs.where.outputs.site }}
        run: |
          npm ci --no-audit --no-fund
          grep -qx "name = \"$WORKER\"" wrangler.toml
          # The bridge apps live in R2. Without R2 (not turned on, or the token
          # lacks "Workers R2 Storage: Edit") the relay offers no downloads.
          if npx wrangler r2 bucket list | grep -qE "(^|[[:space:]])$BUCKET\$" || npx wrangler r2 bucket create "$BUCKET"; then
            echo "r2=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 isn't usable; the relay deploys without the bridge apps"
            sed -i '/^\[\[r2_buckets\]\]/,/^bucket_name/d' wrangler.toml
          fi
          if [ "$WORKER" = cloud-slicer-relay-test ]; then
            # The test relay says what it runs; the Device tab shows it.
            npx wrangler deploy --name "$WORKER" --var "TEST_RELAY:$WHAT" --var "SITE_ORIGIN:$SITE" --var "RELAY_ORIGIN:$RELAY_ORIGIN" | tee deploy.log
            # The site's ticket key, so signed-in people get in as they do on the live relay.
            # The test relay serves the branch previews, so it takes the previews' key
            # (the production one if previews have none), set on every deploy so it
            # never lags behind the site's.
            cfg=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ vars.CF_PAGES_PROJECT || 'cloud-slicer' }}")
            prod=$(printf '%s' "$cfg" | jq -r '.result.deployment_configs.production.env_vars.RELAY_TICKET_PUBLIC_KEY.value // empty')
            prev=$(printf '%s' "$cfg" | jq -r '.result.deployment_configs.preview.env_vars.RELAY_TICKET_PUBLIC_KEY.value // empty')
            fp() { [ -n "$1" ] && printf '%s' "$1" | sha256sum | cut -c1-12 || echo none; }
            echo "Ticket keys: production $(fp "$prod"), previews $(fp "$prev")"
            # Best of all, the key the branch's own site actually signs with.
            site_key=$(curl -fsS --retry 3 "$SITE/api/relay/key" | jq -ce 'select(.x and .y)' || true)
            echo "Ticket key from $SITE: $(fp "$site_key")"
            key=${site_key:-${prev:-$prod}}
            if [ -n "$key" ]; then printf '%s' "$key" | npx wrangler secret put RELAY_TICKET_PUBLIC_KEY --name "$WORKER"
            else echo "::warning::The site has no relay ticket key yet; the test relay lets any pairing code in"; fi
          else
            npx wrangler deploy | tee deploy.log
            # The key the live site really signs tickets and setup-code claims with,
            # set on every deploy: a relay holding another key turns every bridge away
            # ("Cloud Slicer's answer couldn't be checked", "Sign in").
            site_key=$(curl -fsS --retry 3 "$SITE/api/relay/key" | jq -ce 'select(.x and .y)' || true)
            echo "Ticket key from $SITE: $(printf '%s' "$site_key" | sha256sum | cut -c1-12)"
            if [ -n "$site_key" ]; then printf '%s' "$site_key" | npx wrangler secret put RELAY_TICKET_PUBLIC_KEY --name "$WORKER"
            else echo "::warning::Couldn't read the ticket key from $SITE; the live relay keeps the one it has"; fi
          fi
          # Print alerts: the relay's push key, made once and then kept (a new one
          # would make every browser turn alerts on again). Only the relay has it.
          if ! npx wrangler secret list --name "$WORKER" | grep -q '"VAPID_KEY"'; then
            node -e "const k=require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'});process.stdout.write(JSON.stringify(k.privateKey.export({format:'jwk'})))" | npx wrangler secret put VAPID_KEY --name "$WORKER"
          fi
          # Alert camera pictures are kept for a day, then R2 deletes them.
          if grep -q '^\[\[r2_buckets\]\]' wrangler.toml && ! npx wrangler r2 bucket lifecycle list "$BUCKET" | grep -q 'alert-pictures'; then
            npx wrangler r2 bucket lifecycle add "$BUCKET" alert-pictures alerts/ --expire-days 1 --force || echo "::warning::Could not set the one-day rule for alert pictures"
          fi
          old=$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | tail -1)
          url=$RELAY_ORIGIN
          echo "### ${{ matrix.target }} relay: $url (also $old)" >> "$GITHUB_STEP_SUMMARY"
          # Both addresses answer, and both hand out install lines with the relay's own one.
          for at in "$url" "$old"; do
            curl -fsS --retry 3 "$at/"
            curl -fsS --retry 3 "$at/install.sh" | grep -qx "RELAY=\"$url\"" || { echo "::error::$at/install.sh doesn't name $url"; exit 1; }
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy
      - name: Check the deployed relay end to end (mock printer, no browser)
        if: steps.deploy.outputs.url != ''
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          # The relay only lets in browsers with the site's tickets. CI can't sign
          # those, so it gives the relay a throwaway test key of its own (replaced every
          # run, the private half never leaves this job), good only for "ci-" bridges.
          node -e "const k=require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'});const f=require('fs');f.writeFileSync('$RUNNER_TEMP/pub.json',JSON.stringify(k.publicKey.export({format:'jwk'})));f.writeFileSync('$RUNNER_TEMP/priv.json',JSON.stringify(k.privateKey.export({format:'jwk'})))"
          (cd ../device-relay && npx wrangler secret put RELAY_TEST_PUBLIC_KEY --name "$WORKER" < "$RUNNER_TEMP/pub.json")
          export RELAY_TICKET_PRIVATE_KEY="$(cat "$RUNNER_TEMP/priv.json")"
          # A new secret takes a few seconds to reach the relay; until then it turns
          # CI's tickets away ("Sign in"). Give it up to three tries.
          for try in 1 2 3; do
            node test/device/relay-live.mjs '${{ steps.deploy.outputs.url }}' && break
            [ "$try" = 3 ] && exit 1
            sleep 15
          done
      - uses: actions/download-artifact@v7
        if: steps.deploy.outputs.r2 == 'ok'
        with:
          pattern: ${{ matrix.target == 'test' && 'bridge-test-app-*' || 'bridge-app-*' }}
          path: apps/device-bridge/dist
          merge-multiple: true
      - name: Build the bridge apps and upload them to R2
        if: steps.deploy.outputs.r2 == 'ok'
        working-directory: apps/device-bridge
        env:
          BRIDGE_SIGNING_KEY: ${{ secrets.BRIDGE_SIGNING_KEY }}
          # Test builds: their own names, the test relay built in, one build number for all.
          FLAVOR: ${{ matrix.target == 'test' && 'test' || '' }}
          RELAY_URL: ${{ matrix.target == 'test' && 'https://cloud-slicer-relay-test.awesomestuff.qzz.io' || '' }}
          TEST_BUILD: ${{ matrix.target == 'test' && needs.where.outputs.build || '' }}
        run: |
          build=${TEST_BUILD:-$(git log -1 --format=%ct)}
          # The Linux builds here; Windows and Mac came from their own jobs.
          BUILD=$build ./build.sh linux-x64 linux-arm64 linux-armv7 linux-mipsle
          if [ -n "$FLAVOR" ]; then ./dist/linux-x64 version | grep -q " $FLAVOR)"; fi
          for name in windows-x64 mac-arm64 mac-x64 linux-x64 linux-arm64 linux-armv7 linux-mipsle; do
            (cd ../device-relay && npx wrangler r2 object put "$BUCKET/bridge/$name" --file "../device-bridge/dist/$name" --remote --content-type application/octet-stream)
          done
          # Last, the signed release the installed bridges update themselves from: only
          # after every file is up and the new relay passed its live check above.
          if [ -n "$BRIDGE_SIGNING_KEY" ]; then
            go run ./tools/release sign "$build" dist
            (cd ../device-relay && npx wrangler r2 object put "$BUCKET/bridge/release.json" --file ../device-bridge/dist/release.json --remote --content-type application/json)
            curl -fsS '${{ steps.deploy.outputs.url }}/bridge-release.json' | grep -q '"linux-arm64"'
          else
            echo "::warning::No BRIDGE_SIGNING_KEY secret: bridges won't update themselves"
          fi
          curl -fsS '${{ steps.deploy.outputs.url }}/downloads.json' | tee /dev/stderr | grep -q '"linux-arm64"'
          curl -fsS '${{ steps.deploy.outputs.url }}/install.sh' > "$RUNNER_TEMP/install.sh"
          grep -qF 'RELAY="${{ steps.deploy.outputs.url }}"' "$RUNNER_TEMP/install.sh"
          grep -qF '/download/$os-$arch' "$RUNNER_TEMP/install.sh"
