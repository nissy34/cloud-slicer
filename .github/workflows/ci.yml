name: CI

# Builds the wasm engine, runs every test suite, smoke-tests the web app in
# Chromium and deploys it to Cloudflare Pages (production from main, a preview
# for every other branch) when the Cloudflare secrets are set:
#   secrets.CLOUDFLARE_API_TOKEN   token with Pages: Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  account id
#   vars.CF_PAGES_PROJECT          optional project name (default cloud-slicer)
# Accounts (sign-in) also need the token to have "D1: Edit", and these
# secrets, which the deploy copies into the Pages project:
#   secrets.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# The Admin page needs secrets.OWNER_EMAILS (the owner's Google email); its
# usage numbers optionally secrets.CLOUDFLARE_ANALYTICS_TOKEN (read-only).
# CI never talks to a real printer: printer tests run against a mock Moonraker.
#
# Jobs, so independent work runs side by side:
#   unit ─────────────────────────────────────────────┐
#   engine ─┬─ engine-tests ──────────────────────────┤
#           └─ site ── browser (smoke, startup,       ├─ deploy
#                       presets, accounts, toolbar,   │
#                       mixing, cancel, orca,         │
#                       brands) ──────────────────────┘
# The engine job reuses the last build when nothing it is built from changed
# (see the engine key below), so most runs skip Emscripten entirely.
# There are two engines (engine/README.md, "Two engines"): Snapmaker Orca and
# upstream OrcaSlicer. engine and engine-tests run once for each; the site
# carries both (the page loads OrcaSlicer with ?engine=orca).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on main never wait for
# each other (each has its own group); only their deploys are ordered, below.
# A cancelled run can lose a half-done dependency build, but main keeps its own
# copy of that cache, which every branch can read.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  EMSDK_VERSION: 6.0.12
  # Bump to force an engine rebuild when the build itself changes (flags,
  # commands in this file) but no engine source did.
  ENGINE_CACHE_VERSION: 1
  # npm gives up after 2 tries by default; registry downloads now and then drop
  # mid-way (ECONNRESET), so try harder before failing the job.
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Printer driver tests
        working-directory: packages/printer
        run: npm test

      - name: Web app typecheck and unit tests
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Writes the built engine to the engine-builds release (see "Publish the engine").
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: snapmaker
            name: Snapmaker Orca
            submodule: engine/orcaslicer
            out: engine/build/engine
            ccache: ''
          - flavor: orca
            name: OrcaSlicer
            submodule: engine/orcaslicer-upstream
            out: engine/build/engine-orca
            ccache: orca-
    name: engine (${{ matrix.name }})
    # The later jobs work out the same keys themselves (engine-key.mjs), since a
    # matrix job has only one set of outputs.
    steps:
      - uses: actions/checkout@v5

      # Everything the wasm build reads: the pinned Orca commit, the engine's
      # own sources and patches, the dependency script and the toolchain.
      # Tests, presets bundling and engine/node are not part of it.
      # engine/scripts/engine-key.mjs computes it, so a checkout can tell which
      # published build matches it.
      - name: Engine key
        id: key
        run: |
          name=$(node engine/scripts/engine-key.mjs --flavor ${{ matrix.flavor }})
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "key=engine-out-$name" >> "$GITHUB_OUTPUT"

      - name: Reuse an engine built from the same sources
        id: engine-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.out }}/orca-engine.*
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Fetch the pinned ${{ matrix.name }} submodule (shallow)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          SUB: ${{ matrix.submodule }}
        run: |
          sha=$(git ls-tree HEAD "$SUB" | awk '{print $3}')
          url=$(git config -f .gitmodules "submodule.$SUB.url")
          cd "$SUB"
          git init -q && git remote add origin "$url"
          git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq ninja-build ccache
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Restore engine dependencies
        if: steps.engine-cache.outputs.cache-hit != 'true'
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/build/deps
          key: engine-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('engine/scripts/build-deps.sh') }}

      # Feature branches can only read caches from their own branch and main, so
      # a main run that fails here leaves every new branch rebuilding from
      # scratch. ftp.gnu.org (gmp, mpfr) regularly times out: retry downloads
      # through a .curlrc (this step only) so build-deps.sh, and with it the cache key, stays as is.
      - name: Build engine dependencies (cache miss only)
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        env:
          CURL_HOME: ${{ runner.temp }}/curl-retry
        run: |
          mkdir -p "$CURL_HOME"
          printf '%s\n' 'retry = 6' 'retry-delay = 20' 'retry-all-errors' 'connect-timeout = 30' > "$CURL_HOME/.curlrc"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          engine/scripts/build-deps.sh

      # Saved right away, so a later failing step doesn't throw the build away.
      - name: Save engine dependencies
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: engine/build/deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: engine-ccache-${{ matrix.ccache }}${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: engine-ccache-${{ matrix.ccache }}${{ env.EMSDK_VERSION }}-

      - name: Build the engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          EM_COMPILER_WRAPPER: ccache
          CCACHE_DIR: ${{ runner.temp }}/ccache
          # Each engine build saves its own copy, and the repo has 10 GB of cache
          # in total; a small cap keeps these from evicting the dependency cache.
          CCACHE_MAXSIZE: 1G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S engine -B "${{ matrix.out }}" -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_FLAVOR=${{ matrix.flavor }}
          cmake --build "${{ matrix.out }}"
          ls -la "${{ matrix.out }}"/orca-engine.*
          ccache -s | tee "$RUNNER_TEMP/ccache.txt" | head -8
          { echo '### ${{ matrix.name }} engine build'; echo "dependency cache hit: ${{ steps.deps-cache.outputs.cache-hit || 'false' }}";
            echo '```'; head -8 "$RUNNER_TEMP/ccache.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: engine-ccache-${{ matrix.ccache }}${{ env.EMSDK_VERSION }}-${{ github.sha }}

      # The later jobs restore the engine from this cache.
      - name: Save the engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.out }}/orca-engine.*
          key: ${{ steps.key.outputs.key }}

      # Every engine also goes to one GitHub pre-release, `engine-builds`, as
      # engine-<key>.tar.gz, so anyone (cloud sessions included, which can't
      # download Actions artifacts) gets it in seconds with
      # engine/scripts/fetch-engine.mjs instead of building it. Not for pull
      # requests from forks, whose token can't write. Never fails the run.
      - name: Is the engine published?
        id: published
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="engine-${{ steps.key.outputs.name }}.tar.gz"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if gh release view engine-builds --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "$asset"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the engine to publish it
        if: steps.published.outputs.exists == 'false' && steps.engine-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.out }}/orca-engine.*
          key: ${{ steps.key.outputs.key }}

      - name: Publish the engine
        if: steps.published.outputs.exists == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.published.outputs.asset }}
        run: |
          gh release view engine-builds >/dev/null 2>&1 ||
            gh release create engine-builds --prerelease --latest=false --target main --title "Engine builds" \
              --notes "Wasm engines built by CI, one file per engine key, for engine/scripts/fetch-engine.mjs. Not a release of the app; old files are removed automatically." ||
            gh release view engine-builds >/dev/null
          cd "${{ matrix.out }}"
          tar -czf "$RUNNER_TEMP/$ASSET" orca-engine.*
          ls -la "$RUNNER_TEMP/$ASSET"
          gh release upload engine-builds "$RUNNER_TEMP/$ASSET" --clobber
          echo "### Published \`$ASSET\` to the engine-builds release" >> "$GITHUB_STEP_SUMMARY"

      # Keeps the 15 newest engines, and anything younger than 30 days.
      - name: Remove old published engines
        if: steps.published.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/engine-builds" \
            -q "[.assets | sort_by(.created_at) | reverse | .[15:][] | select(.created_at < \"$cutoff\") | .id] | .[]" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done

      - name: Summary
        if: steps.engine-cache.outputs.cache-hit == 'true'
        run: echo '### ${{ matrix.name }} engine unchanged, reused the build for `${{ steps.key.outputs.key }}`' >> "$GITHUB_STEP_SUMMARY"

  engine-tests:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: snapmaker
            name: Snapmaker Orca
            out: engine/build/engine
            profiles: engine/build/profiles
          - flavor: orca
            name: OrcaSlicer
            out: engine/build/engine-orca
            profiles: engine/build/profiles-orca
    name: engine-tests (${{ matrix.name }})
    env:
      ENGINE_FLAVOR: ${{ matrix.flavor }}
      ORCA_ENGINE_JS: ${{ github.workspace }}/${{ matrix.out }}/orca-engine.js
      ORCA_PROFILES: ${{ github.workspace }}/${{ matrix.profiles }}/profiles.json
    steps:
      - uses: actions/checkout@v5
      # Both engines' sources: presets, calibration models and fonts come from them.
      - name: Fetch the pinned Snapmaker Orca and OrcaSlicer submodules (shallow)
        run: |
          for sub in engine/orcaslicer engine/orcaslicer-upstream; do
            sha=$(git ls-tree HEAD "$sub" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sub.url")
            (cd "$sub" && git init -q && git remote add origin "$url" &&
              git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD)
          done
      - name: Engine keys
        id: key
        run: |
          echo "snapmaker=engine-out-$(node engine/scripts/engine-key.mjs)" >> "$GITHUB_OUTPUT"
          echo "orca=engine-out-$(node engine/scripts/engine-key.mjs --flavor orca)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.out }}/orca-engine.*
          key: ${{ steps.key.outputs[matrix.flavor] }}
          fail-on-cache-miss: true

      - name: Bundle the ${{ matrix.name }} presets
        run: node engine/scripts/bundle-profiles.mjs "${{ matrix.profiles }}"

      - name: Engine tests (Node)
        run: |
          node --test engine/node/engine.test.mjs
          node engine/node/slice.mjs fixtures/3DBenchy.stl /tmp/benchy.gcode
          grep -q '^PRINT_START' /tmp/benchy.gcode

  site:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Both engines' sources: presets, calibration models and fonts come from them.
      - name: Fetch the pinned Snapmaker Orca and OrcaSlicer submodules (shallow)
        run: |
          for sub in engine/orcaslicer engine/orcaslicer-upstream; do
            sha=$(git ls-tree HEAD "$sub" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sub.url")
            (cd "$sub" && git init -q && git remote add origin "$url" &&
              git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD)
          done
      - name: Engine keys
        id: key
        run: |
          echo "snapmaker=engine-out-$(node engine/scripts/engine-key.mjs)" >> "$GITHUB_OUTPUT"
          echo "orca=engine-out-$(node engine/scripts/engine-key.mjs --flavor orca)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Restore the Snapmaker Orca engine
        uses: actions/cache/restore@v5
        with:
          path: engine/build/engine/orca-engine.*
          key: ${{ steps.key.outputs.snapmaker }}
          fail-on-cache-miss: true
      - name: Restore the OrcaSlicer engine
        uses: actions/cache/restore@v5
        with:
          path: engine/build/engine-orca/orca-engine.*
          key: ${{ steps.key.outputs.orca }}
          fail-on-cache-miss: true

      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The settings a preset shares between the engines, and each engine's
      # stand-in presets for the other's (src/lib/preset-engines.ts).
      - name: Shared preset settings are up to date
        working-directory: apps/web
        run: node scripts/shared-settings.mjs --check

      - uses: actions/upload-artifact@v6
        with:
          name: web-site
          path: apps/web/dist
          retention-days: 7

  browser:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, startup, presets, presetfiles, accounts, toolbar, mixing, wipetower, loading, cancel, orca, brands]
    name: browser (${{ matrix.suite }})
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: web-site
          path: apps/web/dist
      - name: Install
        run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/playwright

      - name: Browser smoke test (Chromium)
        if: matrix.suite == 'smoke'
        run: node test/smoke.mjs ../../fixtures/3DBenchy.stl smoke.png

      - name: OrcaSlicer smoke test and choosing the engine per project (Chromium)
        if: matrix.suite == 'orca'
        run: |
          SMOKE_ENGINE=orca node test/smoke.mjs ../../fixtures/3DBenchy.stl smoke-orca.png
          mkdir -p engine-shots
          node test/engines.mjs engine-shots
          node test/shared-presets.mjs engine-shots
          node test/engine-switch.mjs engine-shots

      - uses: actions/upload-artifact@v6
        if: always() && matrix.suite == 'orca'
        with:
          name: engine-screenshots
          path: apps/web/engine-shots

      - name: Every printer brand, loaded per brand, with the Direct print mark, its own bed, the first visit's wizard, flushing volumes and filament counts per printer and engine (Chromium)
        if: matrix.suite == 'brands'
        run: |
          mkdir -p brand-shots
          node test/brands.mjs brand-shots
          node test/first-run.mjs brand-shots
          node test/flush.mjs brand-shots
          node test/bed.mjs brand-shots
          node test/filament-count.mjs brand-shots

      - uses: actions/upload-artifact@v6
        if: always() && matrix.suite == 'brands'
        with:
          name: brand-screenshots
          path: apps/web/brand-shots

      - name: Engine startup matrix (Chromium + current stable Chrome)
        if: matrix.suite == 'startup'
        # Stable Chrome comes with the runner image; `playwright install chrome`
        # would download a 138 MB copy again on every run, which sometimes drops.
        run: |
          google-chrome --version
          STARTUP_CHROME=1 node test/startup-matrix.mjs

      - name: User presets end to end (Chromium)
        if: matrix.suite == 'presets'
        run: |
          node test/presets.mjs
          node test/convert.mjs
          node test/settings.mjs
          node test/calibration.mjs

      - name: Preset editing, import and export end to end (Chromium)
        if: matrix.suite == 'presetfiles'
        run: |
          node test/preset-files.mjs preset-shots
          node test/settings-pages.mjs preset-shots

      - uses: actions/upload-artifact@v6
        if: always() && matrix.suite == 'presetfiles'
        with:
          name: preset-screenshots
          path: apps/web/preset-shots

      - name: Colour mixing, loading the printer's filaments and slicing warnings end to end (Chromium, mock printer)
        if: matrix.suite == 'mixing'
        run: |
          node test/mixing.mjs
          node test/sync-filaments.mjs
          node test/warnings.mjs

      - name: Prime tower, phone 3D view gestures, plate menu, transform fields and layer slider items end to end (Chromium)
        if: matrix.suite == 'wipetower'
        run: |
          node test/wipe-tower.mjs
          node test/view-touch.mjs
          node test/plate-menu.mjs
          node test/layer-codes.mjs
          node test/transform-fields.mjs

      - name: Loading screen and Preview colour key end to end (Chromium)
        if: matrix.suite == 'loading'
        run: |
          node test/loading.mjs
          node test/preview-views.mjs

      - name: Slice cancel, engine restart and big models end to end (Chromium)
        if: matrix.suite == 'cancel'
        run: |
          node test/cancel.mjs
          node test/restart.mjs
          node test/heavy.mjs

      - name: Accounts end to end (Pages Functions + local D1, mock OAuth)
        if: matrix.suite == 'accounts'
        run: node test/accounts.mjs

      - name: Object toolbar end to end (Chromium)
        if: matrix.suite == 'toolbar'
        run: node test/toolbar.mjs toolbar-shots

      - uses: actions/upload-artifact@v6
        if: always() && matrix.suite == 'toolbar'
        with:
          name: toolbar-screenshots
          path: apps/web/toolbar-shots

      - uses: actions/upload-artifact@v6
        if: always() && (matrix.suite == 'smoke' || matrix.suite == 'orca')
        with:
          name: ${{ matrix.suite }}-screenshot
          path: apps/web/smoke*.png

  deploy:
    needs: [unit, engine-tests, browser]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deploy per branch at a time, in order.
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      # Runs on main can finish out of order; an older one must not replace a
      # newer deploy. A newer commit on main deploys itself.
      - name: Still the newest commit?
        id: current
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_REF_NAME moved on to $head; that run deploys instead"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/download-artifact@v7
        if: steps.current.outputs.deploy == 'true'
        with:
          name: web-site
          path: apps/web/dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'cloud-slicer' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          # Creates the project on the first run; harmless "already exists" afterwards.
          npx wrangler pages project create "$PROJECT" --production-branch=main || true
          # Accounts: D1 database + migrations, sign-in secrets. Every deploy
          # (previews too) shares one database, so migrations must stay additive.
          node scripts/setup-accounts.mjs | tee accounts.log
          if grep -q '^d1=ok' accounts.log; then
            npx wrangler d1 migrations apply cloud-slicer --remote \
              || echo "::warning::D1 migrations failed; accounts may not work on this deploy"
          fi
          npx wrangler pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" | tee deploy.log
          url=$(grep -Eo 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/playwright
        if: steps.deploy.outputs.url != ''
      - name: Smoke test the deployed site
        if: steps.deploy.outputs.url != ''
        timeout-minutes: 20
        run: |
          # A new Pages project or branch alias gets its TLS certificate a few
          # minutes after the first deploy; wait until the site answers over https.
          url='${{ steps.deploy.outputs.url }}'
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "$url" && break
