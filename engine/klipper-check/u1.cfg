# A stand-in for the Snapmaker U1 in Klipper's batch mode: its 270 mm bed,
# its four heads (T0 to T3), and the U1's own commands (the ones Snapmaker's
# U1 presets use) as empty macros, so any other unknown command still fails.
# Pins are the simulated atmega644p board's; nothing here drives hardware.
[mcu]
serial: /dev/null

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 20000
max_z_velocity: 30
max_z_accel: 500

[stepper_x]
step_pin: PB0
dir_pin: PB1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB2
position_endstop: 0
position_min: 0
position_max: 270

[stepper_y]
step_pin: PB3
dir_pin: PC2
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_min: 0
position_max: 270

[stepper_z]
step_pin: PC4
dir_pin: PC5
enable_pin: !PD7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC6
position_endstop: 0
position_min: -5
position_max: 270

[extruder]
step_pin: PC7
dir_pin: PD4
enable_pin: !PD7
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: watermark
min_temp: 0
max_temp: 320
max_extrude_only_distance: 200

[gcode_macro T0]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

[extruder1]
step_pin: PB4
dir_pin: PB5
enable_pin: !PD7
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control: watermark
min_temp: 0
max_temp: 320
max_extrude_only_distance: 200

[gcode_macro T1]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder1

[extruder2]
step_pin: PB6
dir_pin: PB7
enable_pin: !PD7
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
control: watermark
min_temp: 0
max_temp: 320
max_extrude_only_distance: 200

[gcode_macro T2]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder2

[extruder3]
step_pin: PA3
dir_pin: PA4
enable_pin: !PD7
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA5
control: watermark
min_temp: 0
max_temp: 320
max_extrude_only_distance: 200

[gcode_macro T3]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder3

[heater_bed]
heater_pin: PC0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PC1

[virtual_sdcard]
path: /tmp

[exclude_object]
[pause_resume]
[display_status]
[respond]
[gcode_arcs]

