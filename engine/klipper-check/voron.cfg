# A plain Klipper printer in batch mode, sized like the Voron 2.4 300 preset:
# 300 mm bed, one head, heated bed. Pins are the simulated atmega644p board's.

[mcu]
serial: /dev/null

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 20000
max_z_velocity: 30
max_z_accel: 500

[stepper_x]
step_pin: PB0
dir_pin: PB1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB2
position_endstop: 300
position_max: 300
homing_speed: 100

[stepper_y]
step_pin: PB3
dir_pin: PC2
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 300
position_max: 300
homing_speed: 100

[stepper_z]
step_pin: PC4
dir_pin: PC5
enable_pin: !PD7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC6
position_endstop: 0
position_max: 280
position_min: -5

[extruder]
step_pin: PC7
dir_pin: PD4
enable_pin: !PD7
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA5
control: watermark
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PD6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PB4

[virtual_sdcard]
path: /tmp

[exclude_object]
[pause_resume]
[display_status]
[respond]
[gcode_arcs]
[firmware_retraction]

[gcode_macro PRINT_START]
gcode:
  G28

[gcode_macro PRINT_END]
gcode:
  TURN_OFF_HEATERS
